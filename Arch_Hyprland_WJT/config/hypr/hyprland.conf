# Configuración de Xwayland

# *Forza el escalado de aplicaciones X11 en Hyprland.

xwayland {
   force_zero_scaling = true
}

# Configuración de pantalla, tamaño, y disposición
monitor =,preferred, auto,auto
#LVDS-1, 1366x768, 0x0, 1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$term        = kitty
$fox         = firefox
$fileManager = thunar
#$gnome       = gnome-software
#$kde         = discover

$whatsapp      = flatpak run io.github.mimbrero.WhatsAppDesktop
$code          = code
#$Datcord       = flatpak run io.github.gamingdoom.Datcord

#$menu = rofi -show drun

# Some default env vars.
#env = XCURSOR_SIZE,24
#env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = latam
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 20
    border_size = 2
#   col.active_border = rgba(33ccffee) # rgba(33ccffee) rgba(33ccffee) rgba(33ccffee) rgba(33ccffee) rgba(33ccffee) $ rgba(00ff99ee) rgba(00ff99ee) rgba(00ff99ee) rgba(00ff99ee) 45deg
#   col.inactive_border = rgba(595959aa)
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    #allow_tearing = false
}

#decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    
 #   rounding = 10
    
  #  blur {
    #     enabled = true
    #    size = 3
    #   passes = 1
    #}

#    drop_shadow = yes
#    shadow_range = 4
#    shadow_render_power = 3
#    col.shadow = rgba(1a1a1aee)
#}

decoration {
    # Configuración actual
    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    #drop_shadow = yes
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)
    
    # Configuración de transparencia
    #active_opacity = 0.94       # Transparencia para ventanas activas (ajusta entre 0 y 1)
    #inactive_opacity = 100     # Transparencia para ventanas inactivas (ajusta entre 0 y 1)
}


animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default

}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

#master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = true
#}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = on
}

#misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
#}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
#windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

#windowrulev2 = suppressevent title, class: .*

windowrulev2 = opacity 0.74, class:^(Rofi)$

windowrulev2 = opacity 0.78, class:gnome

windowrulev2 = opacity 0.84, class:discover

windowrulev2 = opacity 0.70, class:$code

windowrulev2 = opacity 0.90, class:whatsapp

windowrulev2 = opacity 0.94, class:$fileManager

windowrulev2 = opacity 0.74, class:$term

windowrulev2 = opacity 0.98, class:$fox

# Forzar que Rofi tenga el foco y permanezca en primer plano
#windowrule = animation popin, ^(Rofi)$
windowrulev2 = stayfocused, class:^(Rofi)$
windowrulev2 = pin, class:^(Rofi)$

#windowrule = animation popin, $term
#windowrulev2 = float, class:$term
#windowrulev2 = size 1366 768, class:$term

#windowrule = animation popin, class:io.github.mimbrero.WhatsAppDesktop
windowrulev2 = float, class:io.github.mimbrero.WhatsAppDesktop
windowrulev2 = size 1366 768, class:WhatsAppDesktop#io.github.mimbrero.WhatsAppDesktop

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Mueve la ventana activa a el workspace deseado
bind = $mainMod, 1, movetoworkspace, 1
bind = $mainMod, 2, movetoworkspace, 2
bind = $mainMod, 3, movetoworkspace, 3
bind = $mainMod, 4, movetoworkspace, 4
bind = $mainMod, 5, movetoworkspace, 5
bind = $mainMod, 6, movetoworkspace, 6
bind = $mainMod, 7, movetoworkspace, 7
bind = $mainMod, 8, movetoworkspace, 8
bind = $mainMod, 9, movetoworkspace, 9
bind = $mainMod, 0, movetoworkspace, 10

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $term
#bind = $mainMod, Return, exec, $term -e "zsh -ic 'source ~/.zshrc; echo -e \"\n\"; zsh'"
bind = $mainMod, Backspace, exit, 
bind = $mainMod, Space, exec, rofi -show drun -x11 -no-lazy-grab -drun-match-fields name -cache-dir -disable-history /tmp/empty -threads 0 # rofi -show drun
#bind = $mainMod, Space, exec, rofi -show drun -x11 -no-lazy-grab -drun-match-fields name -cache-dir /tmp/empty -threads 0
#bind = $mainMod, S, exec, $gnome #gnome-software 
#bind = $mainMod, D, exec, plasma-discover
bind = $mainMod, X, pseudo, # dwindle
bind = $mainMod, C, togglefloating,
bind = $mainMod, Z, togglesplit, # dwindle
bind = $mainMod, P, exec, $fileManager #thunar # Thunar P = porque estaba cerca de la I y la O, y porque me era comodo en esa ubicación
bind = $mainMod, I, exec, $fox #Navegador Firefox -- brave browser I = Internet 
# bind = $mainMod, O, exec, $whatsapp # WhatsApp O = porque estaba cerca de la I
bind = $mainMod, U, exec, XDG_SESSION_TYPE="X11" discord #$Discord
bind = $mainMod, Y, exec, $code # Visual Studio Code
bind = $mainMod, S, exec, spotify #/usr/bin/streamsquid-app.sh #Spotify escuchar musica

# Captura de pantalla Hyprshot 
# bind = Ctrl, Return, exec, grim -g "$(slurp)" - | wl-copy
# bind = Ctrl, Backspace, exec, flameshot gui # flameshot gui #hyprshot -m region #-m window 
bind = Ctrl, Return, exec,  hyprshot -m region --clipboard-only
bind = Ctrl_Shift, Return, exec, hyprshot -m output --save-path ~/Pictures/

# Bloqueo de equipo con Swaylock
bind = Ctrl, L, exec, swaylock -i /home/waltjt/Imágenes/Wallpapers/spectrum-of-the-sky-hdtv-1080p.jpg

# Atajo para mostrar el menú del sistema con Rofi
bind= $mainMod_Shift, Return, exec, ~/.config/hypr/scripts/system-menu.sh

#  bind= $mainMod_Shift, P, exec, wlogout

# Atajos de teclado
bind = $mainMod, V, exec, ~/.config/hypr/scripts/clipboard.sh show
bind = $mainMod, b, exec, ~/.config/hypr/scripts/clipboard.sh clear
bind = Alt, Return, exec, ~/.config/hypr/scripts/clipboard.sh delete

# Cerrar ventana en donde este el foco
bind = Ctrl, Q, killactive,

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
#bind = $mainMod, 1, workspace, 1
#bind = $mainMod, 2, workspace, 2
#bind = $mainMod, 3, workspace, 3
#bind = $mainMod, 4, workspace, 4
#bind = $mainMod, 5, workspace, 5
#bind = $mainMod, 6, workspace, 6
#bind = $mainMod, 7, workspace, 7
#bind = $mainMod, 8, workspace, 8
#bind = $mainMod, 9, workspace, 9
#bind = $mainMod, 0, workspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = Ctrl, mouse_down, workspace, e-1
bind = Ctrl, mouse_up, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Crear un nuevo workspace con Alt + Flecha Derecha
bind = alt, right, exec, hyprctl dispatch workspace $(($(hyprctl workspaces -j | jq -r '.[].id' | sort -n | tail -n 1) + 1))

# Crear un nuevo workspace con Alt + Flecha Izquierda
bind = alt, left, exec, hyprctl dispatch workspace $(($(hyprctl workspaces -j | jq -r '.[].id' | sort -n | head -n 1) - 1))

# Atajo de teclado para cambiar de workspace
bind = Ctrl, right, workspace, e+1 #next
bind = Ctrl, left, workspace, e-1 #prev

# bind = Ctrl, Tab, workspace, e+1 #next
# bind = Shift, Tab, workspace, e-1 #prev

bind = Alt, d, workspace, e+1 #next
bind = Alt, a, workspace, e-1 #prev

# Crear un nuevo workspace con Alt + Flecha Derecha
bind = Alt, c, exec, hyprctl dispatch workspace $(($(hyprctl workspaces -j | jq -r '.[].id' | sort -n | tail -n 1) + 1))

# Crear un nuevo workspace con Alt + Flecha Izquierda
bind = Alt, z, exec, hyprctl dispatch workspace $(($(hyprctl workspaces -j | jq -r '.[].id' | sort -n | head -n 1) - 1))

## Atajos de tecla para el control de volumen de sonido y brillo ##

# Para aumentar volumen con atajo de teclas si el teclado las tiene (Fn+vol +/-)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

# Para aumentar el volumen
bindel = Ctrl, Up, exec, pactl set-sink-volume @DEFAULT_SINK@ +1%

# Para disminuir el volumen
bindel = Ctrl, Down, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%

# Para aumentar el brillo
bindel = $mainMod, right, exec, brightnessctl set 1%+

# Para disminuir el brillo
bindel = $mainMod, left, exec, brightnessctl set 1%-

# Silenciar audio
bind = $mainMod , Up, exec, pactl set-sink-volume @DEFAULT_SINK@ 45%
bind = $mainMod , Down, exec, pactl set-sink-volume @DEFAULT_SINK@ 0%
